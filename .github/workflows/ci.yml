name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Compile (syntax gate)
        run: python -m compileall -q backend
      - name: Install ruff
        run: pip install ruff
      - name: Ruff (advisory)
        continue-on-error: true
        run: ruff check backend --output-format=concise

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: README numbers match repository
        run: python scripts/repo_stats.py --check
      - name: No local absolute paths
        run: |
          if git grep -nE "[A-Z]:\\\\Users\\\\|/Users/[a-z]+/" -- '*.py' '*.jsx' '*.md'; then
            echo "发现本机绝对路径，请改为相对路径或占位符"
            exit 1
          fi