name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install (lint only)
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      - name: Lint
        run: ruff check backend
      - name: Compile
        run: python -m compileall -q backend
      # 说明：selftest.py 与 pytest 依赖完整运行环境与部分内部材料，
      # 在干净容器里会大量 SKIP；它们作为"本地全量回归"提供，不放进 CI 阻断。

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Secret scan
        run: python scripts/check_secrets.py
      - name: README numbers match repository
        run: python scripts/repo_stats.py --check
