[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yancec"
version = "0.9.90"
description = "研策 · 可审计的市场调研智能体（Auditable Market Research Agent）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Yancec" }]
keywords = ["agent", "langgraph", "market-research", "audit", "llm", "rag"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "sqlalchemy>=2.0.25",
    "chromadb>=0.4.24",
    "pdfplumber>=0.11.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.1.0",
    "websockets>=12.0",
    "python-multipart>=0.0.9",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pypdf>=4.0.0",
    "reportlab>=4.0.0",
]

[project.optional-dependencies]
# FlagEmbedding / torch 体积较大，且只影响本地向量检索；
# 不装也能跑（RAG 会降级并在报告里留痕）。
rag = ["FlagEmbedding>=1.2.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.urls]
Homepage = "https://github.com/TOB-L/yancec"
Documentation = "https://github.com/TOB-L/yancec/tree/main/docs"
Issues = "https://github.com/TOB-L/yancec/issues"

[tool.ruff]
line-length = 120
target-version = "py311"
exclude = ["backend/data", "frontend", "backend/selftest.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# 默认只跑确定性用例；端到端（e2e）会触网/调模型，需显式 `pytest -m e2e`
addopts = "-m 'not e2e'"
markers = [
    "e2e: 端到端链路，需要网络或模型凭据，默认跳过",
]

# 源码在 backend/ 下，包根不是仓库根。
# 不显式声明的话，setuptools 会在 flat-layout 里同时看到 backend/ 与 frontend/ 并直接报错。
[tool.setuptools]
package-dir = { "" = "backend" }
packages = ["core", "agents", "mcp"]
